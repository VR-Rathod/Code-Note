name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          👋 **Welcome, Contributor!**  
          Thanks for creating your first issue! 🎉

          We're thrilled to have you here.  
          🔍 While you're waiting:
          - Check out our [Contribution Guide](https://github.com/VR-Rathod/Code-Note/blob/Admin/CONTRIBUTING.md)
          - Join the discussion in our [Code Note](https://github.com/VR-Rathod/Code-Note/discussions)
          - Give us a ⭐️ if you like the project!

          Happy coding! 💻🙏
        pr-message: |
          👋 **Welcome, First-Time Contributor!**  
          Thank you for submitting your first pull request! 🎉

          We're excited to review your changes.  
          🛠 While we take a look:
          - Make sure your PR follows the [Contribution Guide](https://github.com/VR-Rathod/Code-Note/blob/Admin/CONTRIBUTING.md)
          - Feel free to engage in our [Code Note](https://github.com/VR-Rathod/Code-Note/discussions)
          - Consider ⭐️-ing the repo if you find it useful!

          Keep up the great work! 🚀
